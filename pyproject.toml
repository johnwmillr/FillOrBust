[project]
name = "fillorbust"
version = "0.1.0"
description = "Modeling the dice game Fill or Bust"
readme = "README.md"
authors = [
    { name = "John William Ruth Miller", email = "john.w.millr@gmail.com" }
]
requires-python = ">=3.15"
dependencies = []

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "ty>=0.0.93",
]

[tool.ruff]
extend-exclude = ["archive"]
force-exclude = true

[tool.ruff.lint]
extend-select = ["ANN"]

[tool.ty.src]
exclude = ["archive"]

[tool.pytest.ini_options]
testpaths = ["tests"]
